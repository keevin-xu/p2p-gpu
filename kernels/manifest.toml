# Kernel manifest — the registry the coordinator loads at startup.
#
# Format and authoring rules: docs/KERNELS.md
#
# ┌─ BEFORE ADDING A KERNEL ────────────────────────────────────────────────┐
# │ Compute FLOP-per-output-byte. It MUST exceed 1e6 (rule R5), or be       │
# │ redesignable to exceed it via on-node accumulation. Record the          │
# │ calculation in `r5_ratio` / `r5_note` AND as a DECISIONS.md entry,      │
# │ written BEFORE the WGSL (rule R9 / DL1).                               │
# │                                                                         │
# │ Below that bar the workload is transfer-bound and adding nodes will     │
# │ not help. See RESEARCH.md §2 for the derivation.                        │
# └─────────────────────────────────────────────────────────────────────────┘
#
# `determinism` decides how the validator compares replicas. Getting it wrong
# causes honest workers to be blacklisted — a miserable bug to trace (R6).
# When unsure, declare the weaker guarantee.
#   "exact"       → integer-only result path; bitwise comparison valid
#   "tolerant"    → float; requires rel_eps / abs_eps, both justified
#   "statistical" → Monte Carlo; distributional consistency check

# ── Workload B — added in Phase 1, step 1.7 ──────────────────────────────
# Integer-exact, tiny output, trivially clears R5. Deliberately the first
# kernel: it lets the whole pipeline be debugged without the path tracer's
# complexity confounding it.
#
# [kernels.brute_search_v1]
# file            = "brute_search.wgsl"
# entry_point     = "main"
# workgroup_size  = [256, 1, 1]
# determinism     = "exact"
# output_bytes    = 32
# output_dtype    = "u32"
# param_layout    = "BruteSearchParams"
# accumulates     = false
# flop_per_unit   = 128
# r5_ratio        = 4.0e8
# r5_note         = "..."

# ── Workload A — added in Phase 5, step 5.10 ─────────────────────────────
# Fails R5 naively (~6.3e4, 16x short). Clears it only via accumulation.
# `min_iterations` is DERIVED from the step 5.1 calculation, not guessed.
#
# [kernels.pathtrace_tile_v1]
# file            = "pathtrace_tile.wgsl"
# entry_point     = "main"
# workgroup_size  = [8, 8, 1]
# determinism     = "statistical"
# output_bytes    = 65536
# output_dtype    = "f32"
# param_layout    = "PathTraceParams"
# accumulates     = true
# min_iterations  = 100000
# flop_per_unit   = 1000
# r5_ratio        = 6.3e6
# r5_note         = "..."

# ── Calibration — added in step 0.10 ─────────────────────────────────────
# The join-time benchmark kernel. Compute-bound with an exactly known FLOP
# count; its score feeds the adaptive sizer (step 2.12).
#
# Design + full R5 derivation: DECISIONS.md D-0018.
# Measured throughput on real hardware: D-0019.

[kernels.calibrate_v1]
file            = "calibrate.wgsl"
entry_point     = "main"
workgroup_size  = [256, 1, 1]
determinism     = "tolerant"
rel_eps         = 1e-5
abs_eps         = 1e-6
output_bytes    = 4            # per workgroup: one f32 reduction result
output_dtype    = "f32"
param_layout    = "CalibrateParams"
accumulates     = false
iterations      = 2048         # default; R5 fails below ~1954
flop_per_unit   = 2            # one FMA; a work_unit is one FMA op
r5_ratio        = 1.05e6
r5_note = """
ratio = 512 x iterations, and the invocation count N cancels out:
  output_bytes = 4 x (N/256) = N/64      (one f32 per workgroup)
  FLOP         = N x iterations x 4 FMA x 2 = 8 x N x iterations
  ratio        = (8 x N x iterations)/(N/64) = 512 x iterations
At iterations=2048 that is 1.05e6, just over the 1e6 gate. Intensity is a
tuning knob here, not a property of the workload (D-0001). Note that having
every invocation write its own output instead of one per workgroup would give
ratio = 2 x iterations, failing the gate by ~500x at the same iteration count.
"""

# `tolerant`, NOT `exact`: the result is a float sum over 256 partial sums, and
# FMA contraction and summation order legitimately differ across vendors (R6).
# Declaring it `exact` would blacklist honest workers. It is used for timing,
# not for its value, so the epsilons only need to catch a grossly wrong answer.
