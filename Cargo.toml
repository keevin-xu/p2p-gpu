[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/coordinator",
    "crates/worker-native",
    "crates/mock-worker",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/kevinxu/p2p-gpu"

# Dependencies are intentionally NOT declared up front.
#
# Add them per-crate with `cargo add` as each phase requires, so versions
# resolve to whatever is current rather than to a guess baked in at scaffold
# time. The approved dependency baseline is in docs/CONVENTIONS.md §7 —
# anything outside that list needs a DECISIONS.md entry and human sign-off
# (rule DL5).
#
# When a dependency is shared by more than one crate, promote it here under
# [workspace.dependencies] and reference it with `foo = { workspace = true }`.

[workspace.dependencies]

[profile.release]
opt-level = 3
lto = "thin"

# Experiments and load tests are unusable at opt-level 0. This makes
# `cargo test --release` and mock-swarm runs behave sanely without
# needing a custom profile per invocation.
[profile.dev.package."*"]
opt-level = 2
