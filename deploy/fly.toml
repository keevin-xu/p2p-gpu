# fly.toml app configuration file generated for p2pgpu on 2026-08-24T12:09:24-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'p2pgpu'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  RUST_BACKTRACE = '0'

[[mounts]]
  source = 'p2pgpu_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  # RESTORED 2026-08-24 after `flyctl launch --copy-config` silently dropped it.
  # D-0006: leases, the task queue and reputation live in ONE process. A second
  # machine grants the same task twice, and the fleet would look healthy while
  # duplicating work. This line is not tuning — it is a correctness constraint.
  max_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
