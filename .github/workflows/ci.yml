# p2pgpu CI — step 1.29, D-0036.
#
# ┌─ WHAT THIS DOES NOT COVER ──────────────────────────────────────────────┐
# │ GitHub runners have NO GPU. `kernel_tests` is excluded here, and with it │
# │ every claim about kernel correctness, chunk invariance on real hardware, │
# │ cross-vendor determinism, and all timing.                               │
# │                                                                         │
# │ A green run means the PROTOCOL layer is memory-safe and the             │
# │ coordinator's logic holds. It does NOT mean the kernels work. Getting a  │
# │ GPU (or an honest substitute) into CI is step 4.4.                      │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ubuntu-latest, deliberately, not macOS. Matching the dev machine is the
# OPPOSITE of what is wanted: two of the three worst bugs found so far (D-0027,
# D-0028) were alignment defects that ran correctly on arm64 and x86 for weeks,
# and a second architecture replaying the corpus is how the next one surfaces.
# macOS runners also bill at 10x.
#
# ── BILLED MINUTES ───────────────────────────────────────────────────────
# Billing is the SUM of all job durations, so parallel jobs are not free —
# splitting work across jobs only helps if the work differs. The first version
# of this file had three jobs, two of which installed the identical vcpkg
# dependency set, and it cost ~34 min per push.
#
# Two things fix that, and only the second is about job layout:
#
#   1. THE BINARY CACHE MUST ACTUALLY WORK. The first version used
#      `x-gha`, which needs ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN — recent
#      runners renamed the former, so the variable was empty and caching
#      silently did nothing while looking configured. Every run rebuilt
#      OpenSSL, libdatachannel and uWebSockets from source. This version uses a
#      plain directory binary cache with `actions/cache`: dumber, visible in
#      the run log, and verifiable.
#
#   2. ONE JOB, AND ONE INSTALL TREE, FOR BOTH NATIVE BUILDS. `native-debug`
#      and `native-release` need the same `native;tests` dependencies. Merging
#      the jobs was NOT sufficient: every CMake preset has its own binaryDir, so
#      each still got its own vcpkg_installed/ and ran its own install — the
#      release configure was observed rebuilding libdatachannel from source on a
#      runner that had just built it. Both configures now pass
#      VCPKG_INSTALLED_DIR pointing at one shared tree, so the second installs
#      nothing at all.
#
# The fuzz job stays separate because it genuinely differs: it installs NO
# `native` feature at all (D-0015), so it shares almost nothing with the others.

name: ci

on:
  push:
    branches: [main]
    # Docs-only pushes cannot break a build. This project is documentation-heavy
    # by design, so this skips a real fraction of runs.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'results/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'results/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # NO VCPKG_DEFAULT_BINARY_CACHE, deliberately. `lukka/run-vcpkg` OVERRIDES it
  # with a per-run UUID directory and sets VCPKG_BINARY_SOURCES=clear;x-gha —
  # measured on the runner:
  #
  #   VCPKG_DEFAULT_BINARY_CACHE=/home/runner/work/.../969f6665-.../vcpkg_cache
  #   VCPKG_BINARY_SOURCES=clear;x-gha,readwrite
  #
  # So our directory was never written (4 KB, empty) and the path we cached was
  # a fresh UUID every run. Two earlier theories about the small cache were
  # wrong; this is what the diagnostic step actually showed.
  #
  # Rather than fight the action for control of the binary cache, skip the
  # indirection: cache the FINISHED INSTALL TREE. On a hit vcpkg reads its
  # status file and installs nothing, which is strictly better than restoring
  # binary packages and re-resolving them.
  VCPKG_COMMIT: 827a2e1203bc19941126c657166da44f2623acc4  # matches vcpkg.json baseline
  # Where BOTH jobs put their install tree. Set explicitly because every CMake
  # preset otherwise gets its own vcpkg_installed/ under its own binaryDir, and
  # the second configure then reinstalls everything — observed rebuilding
  # libdatachannel on a runner that had just built it.
  #
  # The two jobs use DIFFERENT trees: fuzz installs no `native` feature
  # (D-0015), so sharing one would make each run add and remove packages.
  #
  # BUMP THIS whenever the cache's `path:` list changes.
  #
  # actions/cache does not save when it hits, and the key is derived from
  # vcpkg.json and the baseline — neither of which changes when the *paths*
  # do. So adding vcpkg_installed to the path list without bumping this means
  # every run restores the old, incomplete entry and never stores the new one.
  # Caught exactly that way: a 35 MB cache, about right for the binary-cache
  # directory alone and far too small for a real install tree.
  CACHE_VERSION: v3

jobs:
  # ── The regression net R11 asks for, and the cheapest thing here ────────
  #
  # Separate job because it genuinely differs from the others: P2PGPU_FUZZ_ONLY
  # returns before any GPU dependency and installs NO vcpkg `native` feature
  # (D-0015), so it shares almost no build with them.
  #
  # Uses the `linux-fuzz` preset, not `native-fuzz`. Same build, same harnesses,
  # same corpus — but every toolchain workaround in `native-fuzz` exists for a
  # macOS reason that does not apply: Linux clang ships libFuzzer, and there is
  # no Apple ld to reject a GNU-format archive.
  fuzz:
    name: fuzz (corpus replay + mutation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      - name: Restore vcpkg install tree
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed_fuzz
          # Keyed on the manifest AND the baseline: either one changing means
          # different package versions, so a stale hit would be wrong rather
          # than merely slow.
          key: ${{ env.CACHE_VERSION }}-vcpkg-fuzz-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ env.CACHE_VERSION }}-vcpkg-fuzz-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-


      # 1.29's last open question, answered in the log instead of by inference.
      # The cache took four attempts to get right (a silently-broken x-gha
      # source, a key that did not change when the paths did, and
      # lukka/run-vcpkg overriding our path with a per-run UUID directory), and
      # every diagnosis until the last was wrong. A one-line HIT/MISS beats
      # guessing from job duration.
      - name: Cache status
        run: |
          echo "cache-hit = '${{ steps.cache.outputs.cache-hit }}'"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "HIT — dependencies restored, nothing should be rebuilt below."
          else
            echo "MISS — dependencies will be built from source (expected on the"
            echo "first run after a vcpkg.json, baseline, or CACHE_VERSION change)."
          fi

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 827a2e1203bc19941126c657166da44f2623acc4

      - name: Configure
        run: cmake --preset linux-fuzz -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed_fuzz"
        env:
          CC: clang
          CXX: clang++

      - name: Build
        run: cmake --build build/linux-fuzz

      # DIAGNOSTIC. The cache has been the wrong size twice and both guesses at
      # why were wrong, so measure instead of reasoning. Prints what is actually
      # on disk immediately before actions/cache saves it.
      - name: What is actually being cached
        if: always()
        run: |
          echo "== install trees"
          du -sh "$GITHUB_WORKSPACE/vcpkg_installed" 2>/dev/null || echo "   MISSING"
          ls "$GITHUB_WORKSPACE/vcpkg_installed" 2>/dev/null | head -5
          echo "== any other vcpkg_installed trees the build made"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name vcpkg_installed \
            -exec du -sh {} \; 2>/dev/null
          echo "== vcpkg env actually in effect"
          env | grep -i '^VCPKG' | sort


      # THE REGRESSION NET. -runs=0 replays every committed seed through the
      # frame codec, the Verifier and the invariants under ASan, mutating
      # nothing. Seconds, deterministic, and it is what makes committing a
      # corpus worth doing (R11: "the corpus is committed").
      - name: Replay the committed corpus
        run: ./build/linux-fuzz/fuzz_protocol fuzz/corpus/protocol/ -runs=0

      # ...and keep looking. Short, so it does not gate a push for long; long
      # campaigns stay manual until there are minutes to spare for a nightly.
      - name: Fuzz for 60s
        run: |
          ./build/linux-fuzz/fuzz_protocol fuzz/corpus/protocol/ \
            -max_total_time=60 -print_final_stats=1

      # A crash here is the whole point of the job, so keep the input. Per
      # CONVENTIONS.md §7 T4 it then gets committed as a regression seed — by a
      # human, deliberately, not by this workflow.
      - name: Upload any crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  # ── ASan + UBSan + tests, then the optimized build ─────────────────────
  #
  # ONE job for both. They need the identical `native;tests` dependency set, so
  # as two jobs that set gets installed or restored twice for no benefit. The
  # release step reuses everything and costs only its own compile time.
  native:
    name: native (asan+ubsan + ctest, then release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld pkg-config

      - name: Restore vcpkg install tree
        id: cache
        uses: actions/cache@v4
        with:
          # The finished install tree — 175 MB on the runner, and on a hit vcpkg
          # reads its status file and installs nothing at all.
          path: ${{ github.workspace }}/vcpkg_installed
          key: ${{ env.CACHE_VERSION }}-vcpkg-native-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ env.CACHE_VERSION }}-vcpkg-native-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-


      # 1.29's last open question, answered in the log instead of by inference.
      # The cache took four attempts to get right (a silently-broken x-gha
      # source, a key that did not change when the paths did, and
      # lukka/run-vcpkg overriding our path with a per-run UUID directory), and
      # every diagnosis until the last was wrong. A one-line HIT/MISS beats
      # guessing from job duration.
      - name: Cache status
        run: |
          echo "cache-hit = '${{ steps.cache.outputs.cache-hit }}'"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "HIT — dependencies restored, nothing should be rebuilt below."
          else
            echo "MISS — dependencies will be built from source (expected on the"
            echo "first run after a vcpkg.json, baseline, or CACHE_VERSION change)."
          fi

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 827a2e1203bc19941126c657166da44f2623acc4

      # ── ONE INSTALL TREE FOR BOTH CONFIGURES ────────────────────────
      #
      # Each CMake preset has its own binaryDir, so by DEFAULT each gets its own
      # vcpkg_installed/ and runs its own install. Merging the two jobs did not
      # fix that — the release configure was observed rebuilding libdatachannel
      # from source, on a runner that had just built it.
      #
      # VCPKG_INSTALLED_DIR points both at one tree, so the second configure
      # finds every package already present and installs nothing. This
      # ELIMINATES the duplicate rather than trying to make it fast, which is
      # why it is preferred over leaning harder on the binary cache.
      #
      # Safe across build types: vcpkg installs debug and release variants of
      # every port into the same tree regardless of our CMAKE_BUILD_TYPE.
      - name: Configure (debug + sanitizers)
        run: cmake --preset native-debug -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
        env:
          CC: clang
          CXX: clang++

      - name: Build (debug + sanitizers)
        run: cmake --build build/native-debug

      # -E kernel_ EXCLUDES the GPU tests. They are not skipped for being slow
      # or flaky — this runner has no adapter at all, and a suite that silently
      # passes because it never ran is worse than one honestly absent. See the
      # banner at the top of this file.
      - name: Test (GPU tests excluded — no adapter on CI runners)
        run: ctest --preset native-debug --output-on-failure -E '^kernel_'

      - name: R2 seam check
        run: python3 tools/check_seam.py

      # Optimizer-only breakage is real and the sanitizer build will not show
      # it: different inlining, different UB exploitation, no sanitizer runtime.
      # Build only — the tests already ran above, and running them twice buys
      # little for the minutes.
      # Same tree as above — this configure should install NOTHING.
      - name: Configure (release)
        run: cmake --preset native-release -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
        env:
          CC: clang
          CXX: clang++

      - name: Build (release)
        run: cmake --build build/native-release

      # DIAGNOSTIC. The cache has been the wrong size twice and both guesses at
      # why were wrong, so measure instead of reasoning. Prints what is actually
      # on disk immediately before actions/cache saves it.
      - name: What is actually being cached
        if: always()
        run: |
          echo "== install trees"
          du -sh "$GITHUB_WORKSPACE/vcpkg_installed" 2>/dev/null || echo "   MISSING"
          ls "$GITHUB_WORKSPACE/vcpkg_installed" 2>/dev/null | head -5
          echo "== any other vcpkg_installed trees the build made"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name vcpkg_installed \
            -exec du -sh {} \; 2>/dev/null
          echo "== vcpkg env actually in effect"
          env | grep -i '^VCPKG' | sort

  # ── Step 1.30: the browser worker must keep building ────────────────────
  #
  # A SEPARATE JOB, on purpose. `fuzz` and `native` work and took four attempts
  # to get their caching right; this one shares no step, no cache key and no
  # install tree with them, so a failure here cannot touch either. Jobs without
  # `needs:` are independent — a red wasm job leaves both of the others green.
  #
  # What it protects is R2. `worker-core` compiles to native and to wasm from
  # identical source, and the native jobs above only ever prove one half of
  # that. A portable file that stops building for the browser is otherwise
  # invisible until somebody builds it by hand — which, after 1.23 and 1.24
  # changed that target substantially, is now a real risk rather than a
  # theoretical one.
  #
  # BUILD ONLY. There is no browser and no GPU here, so nothing runs. This job
  # answers "does it still compile and link for wasm32", which is exactly the
  # question the native jobs cannot answer and nothing else does.
  wasm:
    name: wasm (browser worker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Own tree, own key. The wasm preset sets VCPKG_MANIFEST_FEATURES="" and a
      # wasm32-emscripten triplet, so it shares nothing with the native jobs'
      # packages — pointing them at one tree would make every run add and remove
      # ports. The triplet is in the key for the same reason.
      - name: Restore vcpkg install tree (wasm)
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed_wasm
          key: ${{ env.CACHE_VERSION }}-vcpkg-wasm32-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ env.CACHE_VERSION }}-vcpkg-wasm32-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Cache status
        run: |
          echo "cache-hit = '${{ steps.cache.outputs.cache-hit }}'"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "HIT — wasm dependencies restored."
          else
            echo "MISS — wasm dependencies will be built from source."
          fi

      # PINNED to the exact emsdk the project is developed against. Not
      # 'latest': Emscripten 6 removed -sUSE_WEBGPU outright (D-0014), so a
      # silent SDK bump is a hard configure error, and finding that out from CI
      # rather than deliberately is the wrong order. `actions-cache-folder` lets
      # the action cache the SDK itself, which is the expensive part.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache

      - name: Verify the pinned toolchain
        run: emcc --version | head -1

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 827a2e1203bc19941126c657166da44f2623acc4

      # The preset chainloads Emscripten's toolchain THROUGH vcpkg's rather than
      # setting CMAKE_TOOLCHAIN_FILE twice — two toolchains fighting over one
      # variable is how that build broke the first time. setup-emsdk exports
      # EMSDK, which the preset reads.
      #
      # Also fetches datachannel-wasm and upstream BLAKE3 (D-0032, D-0034), and
      # applies the globalThis patch (D-0038). Those are small clones and are
      # deliberately NOT cached: caching FetchContent's subbuild stamps to save
      # a few seconds would add a stale-state failure mode to the one job whose
      # entire purpose is telling us the truth about this target.
      - name: Configure
        run: cmake --preset wasm -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed_wasm"

      - name: Build
        run: cmake --build build/wasm

      # The module and the static R7 surface must all be present. A link that
      # "succeeds" while emitting nothing is a failure mode worth naming.
      - name: Check the artifacts exist
        run: |
          ls -la build/wasm/web/
          for f in p2pgpu-worker.js p2pgpu-worker.wasm index.html ui.js; do
            test -s "build/wasm/web/$f" || { echo "MISSING OR EMPTY: $f"; exit 1; }
          done
          echo "wasm module and R7 page assets present"
